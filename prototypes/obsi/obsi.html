<!DOCTYPE html><head>
  <meta charset="utf-8"/>
  <title>LittleJS OBSI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
  </style>
</head><body>
<script src="../../LittleJS-AI/dist/littlejs.js?1.18.12"></script>
<script>
'use strict';

// engine settings
debugWatermark = false;
showEngineVersion = false;
debugKey = 'Backquote';

// Game constants
const levelSize = vec2(60, 34);
const playMin = vec2(0, 0);
const playMax = levelSize;

const playerY = 3;

// Weapon temperature constants
const TEMP_PER_SHOT = 10;
const TEMP_COOLING_RATE = 0.6;
const TEMP_WARM_MIN = 40;
const TEMP_WARM_MAX = 70;
const TEMP_OVERHEAT = 100;

// Enemy configs
const ENEMY_CONFIGS = {
    shooter:   { shootRate: 60,  score: 16,  health: 1 },
    diver:     { diveSpeed: 2,   diveRate: 120, score: 32,  health: 2 },
    reflector: { score: 160, health: 3 },
    absorber:  { maxStored: 3, spitDelay: 60, score: 256, health: 1 },
    treasure:  { health: 50, score: 500, spawnInterval: 1800 },
    boss:      { health: 50, score: 800 },
};

// Difficulty scaling
function calcDifficulty(waveN)
{
    const c = Math.floor((waveN - 1) / 10) + 1; // Cycle number
    const w = Math.min(waveN, 10); // Linear phase
    const l = waveN > 10 ? Math.sqrt(waveN - 10) : 0; // Sqrt phase

    const baseFactor = 0.8 + (w - 1) * 0.2 + l * 0.1; // Range [0.8, 2.0+]
    const shootRateMult = Math.min(baseFactor, 2.5); // Cap at 2.5x
    const formationSpeedMult = Math.min(baseFactor * 1.5, 3.5); // Faster scaling

    return {
        shootRate: Math.max(20, ENEMY_CONFIGS.shooter.shootRate / shootRateMult),
        formationSpeed: 0.08 * formationSpeedMult,
        diveChance: Math.min(0.8 + (waveN - 1) * 0.05, 1.0),
    };
}

// Global game state
let player;
let bullets = [];
let enemies = [];
let boss = null;
let enemyBullets = [];
let treasure = null;
let waveN = 1;
let waveState = 'transition';
let transitionTimer = new Timer();
let bossDefeatedTimer = new Timer();
let cycleTransitionTimer = new Timer();

// Formation state
let formationDir = 1;
let formationSpeed = 0.08;
let formationShootTimer = 0;
let isBossWave = false;

// Treasure state
let treasureSpawnTimer = 0;

let score = 0;
let hiScore = 0;
let lives = 3;
let currentLevel = 1;

let gameOver = false;
let titleScreen = true;

// Helpers
function clampToPlayfield(pos, halfSize)
{
    pos.x = clamp(pos.x, playMin.x + halfSize.x, playMax.x - halfSize.x);
    pos.y = clamp(pos.y, playMin.y + halfSize.y, playMax.y - halfSize.y);
    return pos;
}

function spawnEnemyGrid()
{
    boss = null;
    isBossWave = waveN % 10 === 0;

    if (isBossWave)
    {
        // Boss wave - spawn single boss
        enemies = [];
        boss = new Boss(vec2(levelSize.x/2, levelSize.y - 5));
    }
    else
    {
        // Normal wave - spawn grid
        enemies = [];
        formationDir = 1;
        formationSpeed = calcDifficulty(waveN).formationSpeed;
        formationShootTimer = 0;

        const cols = 11;
        const rows = 5;
        const startX = levelSize.x/2 - (cols-1)*2.8/2;
        const startY = levelSize.y - 6;
        const spacing = vec2(2.8, 2.3);

        for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
        {
            const pos = vec2(startX + c*spacing.x, startY - r*spacing.y);
            // Spawn mix: row 0 = shooter, row 1 = diver, row 2 = reflector, row 3 = absorber, row 4 = shooter
            if (r === 1) enemies.push(new Diver(pos, r, c));
            else if (r === 2) enemies.push(new Reflector(pos, r, c));
            else if (r === 3) enemies.push(new Absorber(pos, r, c));
            else enemies.push(new Shooter(pos, r, c));
        }
    }
}

// Objects
class RectObject extends EngineObject
{
    constructor(pos, size, color)
    {
        super(pos, size);
        this.color = color || WHITE;
        this.renderOrder = 0;
    }
    render()
    {
        drawRect(this.pos, this.size, this.color);
    }
}

class Player extends RectObject
{
    constructor(pos)
    {
        super(pos, vec2(3.2, 1.4), rgb(.2,.9,.95));
        this.dirX = -1; // Current direction (-1 or 1)
        this.targetVelX = -0.15;
        this.currentVelX = -0.15;
        this.state = 'moving';
        this.renderOrder = 10;

        // Input and timers
        this.chargeTimer = new Timer();
        this.burnoutTimer = new Timer();
        this.speedBurstTimer = new Timer();
        this.pacifistTimer = new Timer();
        this.cooldown = 0;

        // Magic Combo state
        this.holdTime = 0;
        this.pressDir = 0;

        // Temperature system
        this.temperature = 0;
    }

    update()
    {
        // Cool temperature passively
        this.temperature = max(0, this.temperature - TEMP_COOLING_RATE);

        // Check for overheat - trigger burnout if overheated
        if (this.temperature >= TEMP_OVERHEAT && this.state !== 'burnout' && this.state !== 'speed_burst')
        {
            this.state = 'burnout';
            this.targetVelX = this.dirX * 0.3; // 2x speed
            this.burnoutTimer.set(60);
        }

        // State machine
        if (this.state === 'pre_entry')
        {
            this.updatePreEntry();
        }
        else if (this.state === 'moving')
        {
            this.updateMoving();
        }
        else if (this.state === 'charging')
        {
            this.updateCharging();
        }
        else if (this.state === 'charged')
        {
            this.updateCharged();
        }
        else if (this.state === 'speed_burst')
        {
            this.updateSpeedBurst();
        }
        else if (this.state === 'burnout')
        {
            this.updateBurnout();
        }
        else if (this.state === 'pacifist')
        {
            this.updatePacifist();
        }
        else if (this.state === 'exiting')
        {
            this.updateExiting();
        }

        // Apply velocity with acceleration
        this.pos.x += this.currentVelX;
        this.clampToPlayfield();
    }

    updatePreEntry()
    {
        // Pre-entry: no movement, input disabled
        this.targetVelX = 0;
        this.currentVelX = 0;

        // Immediately transition to pacifist (no enemies entering yet)
        this.state = 'pacifist';
        this.pacifistTimer.set(30);
    }

    updateExiting()
    {
        // Exiting: no movement, input disabled
        this.targetVelX = 0;
        this.currentVelX = 0;

        // After a brief exit animation, prepare for next wave
        if (frame % 30 === 0)
        {
            // Reset for next wave
            this.pos = vec2(levelSize.x/2, playerY);
            this.state = 'moving';
            this.temperature = 0;
        }
    }

    updateMoving()
    {
        // Target speed for moving state
        this.targetVelX = this.dirX * 0.15;
        this.accelerateVelocity(10);

        // Auto-shoot with temperature-based fire-rate bonus
        if (this.cooldown > 0) this.cooldown--;
        if (this.cooldown === 0)
        {
            this.cooldown = 20;
            // Warm zone bonus: faster fire rate
            if (this.temperature >= TEMP_WARM_MIN && this.temperature <= TEMP_WARM_MAX)
            {
                this.cooldown = max(8, this.cooldown * 0.6); // Up to 40% faster
            }
            bullets.push(new Bullet(this.pos.add(vec2(0, 0.5)), vec2(0, 0.8)));
            this.temperature += TEMP_PER_SHOT;
        }

        // Magic Combo input
        if (mouseWasPressed(0))
        {
            this.state = 'charging';
            this.pressDir = this.dirX;
            this.holdTime = 0;
            this.chargeTimer.set(60); // Full charge is 60 frames
        }
    }

    updateCharging()
    {
        // Slow movement during charge
        this.targetVelX = this.dirX * 0.03; // 0.2x speed
        this.accelerateVelocity(20);

        if (mouseWasReleased(0))
        {
            // Tap: reverse direction and continue moving
            this.dirX *= -1;
            this.state = 'moving';
            this.pacifistTimer.set(30);
        }
        else if (mouseIsDown(0))
        {
            this.holdTime++;
            if (this.chargeTimer.isSet() && this.chargeTimer.elapsed())
            {
                // Charge complete - enter charged state
                this.state = 'charged';
                this.targetVelX = this.dirX * 0.15; // Resume 1x speed
                this.burnoutTimer.set(60); // Burnout timer
            }
        }
    }

    updateCharged()
    {
        // Resume normal speed
        this.targetVelX = this.dirX * 0.15;
        this.accelerateVelocity(10);

        if (mouseWasReleased(0))
        {
            // Charged release: fire charged shot, speed burst, reverse
            bullets.push(new ChargedBullet(this.pos.add(vec2(0, 0.5)), vec2(0, 1.2)));
            this.dirX *= -1;
            this.targetVelX = this.dirX * 0.6; // 4x speed
            this.state = 'speed_burst';
            this.speedBurstTimer.set(18);
        }
        else if (mouseIsDown(0) && this.burnoutTimer.elapsed())
        {
            // Held too long - trigger burnout
            this.state = 'burnout';
            this.targetVelX = this.dirX * 0.3; // 2x speed
            this.burnoutTimer.set(60);
        }
    }

    updateSpeedBurst()
    {
        // High speed movement
        this.targetVelX = this.dirX * 0.6; // 4x speed
        this.accelerateVelocity(1); // Fast acceleration

        if (this.speedBurstTimer.elapsed())
        {
            // Return to normal
            this.state = 'moving';
            this.targetVelX = this.dirX * 0.15;
        }
    }

    updateBurnout()
    {
        // Fast movement, input locked
        this.targetVelX = this.dirX * 0.3; // 2x speed
        this.accelerateVelocity(5);

        if (this.burnoutTimer.elapsed())
        {
            // Burnout complete
            this.state = 'moving';
            this.targetVelX = this.dirX * 0.15;
        }
    }

    updatePacifist()
    {
        // Moving but no shooting
        this.targetVelX = this.dirX * 0.15;
        this.accelerateVelocity(10);

        if (this.pacifistTimer.elapsed())
        {
            // Resume normal state
            this.state = 'moving';
            this.cooldown = 0;
        }
    }

    accelerateVelocity(accelFrames)
    {
        const accel = 1 / accelFrames;
        this.currentVelX += (this.targetVelX - this.currentVelX) * accel;
    }

    clampToPlayfield()
    {
        const halfSize = this.size.x * 0.5;
        if (this.pos.x - halfSize <= playMin.x)
        {
            this.pos.x = playMin.x + halfSize;
            this.currentVelX = 0;
        }
        if (this.pos.x + halfSize >= playMax.x)
        {
            this.pos.x = playMax.x - halfSize;
            this.currentVelX = 0;
        }
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = .22;
            drawRect(p.add(vec2(0,.3)), vec2(s,s*2), this.color);
            drawRect(p, vec2(s*7,s*3), this.color);
            drawRect(p.add(vec2(-1.1,-.3)), vec2(s*2,s), this.color);
            drawRect(p.add(vec2(1.1,-.3)), vec2(s*2,s), this.color);
        }
    }
}

class Bullet extends RectObject
{
    constructor(pos, vel)
    {
        super(pos, vec2(0.45, 1.0), rgb(.95,.95,.95));
        this.vel = vel;
        this.renderOrder = 20;
    }
    update()
    {
        this.pos = this.pos.add(this.vel);
        if (this.pos.y > playMax.y + 2)
            this.destroy();
    }
}

class ChargedBullet extends RectObject
{
    constructor(pos, vel)
    {
        super(pos, vec2(0.8, 1.5), rgb(.95,.6,.2)); // Larger, orange
        this.vel = vel;
        this.renderOrder = 20;
    }
    update()
    {
        this.pos = this.pos.add(this.vel);
        if (this.pos.y > playMax.y + 2)
            this.destroy();
    }
}

class Shooter extends RectObject
{
    constructor(pos, gridRow, gridCol)
    {
        super(pos, vec2(2.3, 1.6), rgb(.95,.2,.2)); // Red, invader-like
        this.gridRow = gridRow;
        this.gridCol = gridCol;
        this.health = ENEMY_CONFIGS.shooter.health;
        this.shootTimer = 0;
        this.renderOrder = 5;
    }

    update()
    {
        // Movement handled by formation - just wait for shoot timer
        if (this.shootTimer > 0) this.shootTimer--;
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = 0.22;
            // Simple invader sprite
            drawRect(p.add(vec2(0,.3)), vec2(s*3,s), this.color);
            drawRect(p.add(vec2(-.6,.3)), vec2(s,s*3), this.color);
            drawRect(p.add(vec2(.6,.3)), vec2(s,s*3), this.color);
            drawRect(p, vec2(s*6,s*4), this.color);
            drawRect(p.add(vec2(-0.8,-.5)), vec2(s,s*2), this.color);
            drawRect(p.add(vec2(-0.3,-.5)), vec2(s,s*2), this.color);
            drawRect(p.add(vec2(0.3,-.5)), vec2(s,s*2), this.color);
            drawRect(p.add(vec2(0.8,-.5)), vec2(s,s*2), this.color);
        }
    }
}

class Diver extends RectObject
{
    constructor(pos, gridRow, gridCol)
    {
        super(pos, vec2(2.3, 1.6), rgb(.25,.85,.95)); // Cyan
        this.gridRow = gridRow;
        this.gridCol = gridCol;
        this.health = ENEMY_CONFIGS.diver.health;
        this.originalPos = pos.copy();
        this.isDiving = false;
        this.targetX = pos.x;
        this.diveRateTimer = 0;
        this.renderOrder = 5;
    }

    update()
    {
        if (this.isDiving)
        {
            // Dive toward target, then return
            const diveSpeed = ENEMY_CONFIGS.diver.diveSpeed * 0.1; // Scale to world units
            const targetY = playerY + 0.5; // Dive to player level

            if (this.pos.y > targetY)
            {
                // Descending
                this.pos.y -= diveSpeed;
                this.pos.x = lerp(this.pos.x, this.targetX, 0.05); // Smooth X approach
            }
            else
            {
                // Ascending back to formation
                this.pos.y += diveSpeed * 0.5; // Slower ascent
                if (this.pos.y >= this.originalPos.y)
                {
                    // Back at formation
                    this.pos = this.originalPos.copy();
                    this.isDiving = false;
                    this.diveRateTimer = ENEMY_CONFIGS.diver.diveRate;
                }
            }
        }
        else
        {
            // In formation, check dive trigger
            if (this.diveRateTimer > 0) this.diveRateTimer--;
            if (this.diveRateTimer === 0)
            {
                const difficulty = calcDifficulty(waveN);
                if (rand() < difficulty.diveChance)
                {
                    this.isDiving = true;
                    this.targetX = player ? player.pos.x : levelSize.x/2;
                    this.diveRateTimer = ENEMY_CONFIGS.diver.diveRate;
                }
                else
                {
                    this.diveRateTimer = 30; // Check again in 30 frames
                }
            }
        }
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = 0.22;
            // Cyan diver sprite (different from red shooter)
            drawRect(p.add(vec2(0,.5)), vec2(s*4,s), this.color);
            drawRect(p.add(vec2(-0.8,.2)), vec2(s,s*2), this.color);
            drawRect(p.add(vec2(0.8,.2)), vec2(s,s*2), this.color);
            drawRect(p, vec2(s*6,s*3), this.color);
            drawRect(p.add(vec2(-0.6,-.5)), vec2(s*2,s), this.color);
            drawRect(p.add(vec2(0.6,-.5)), vec2(s*2,s), this.color);
        }
    }
}

class Reflector extends RectObject
{
    constructor(pos, gridRow, gridCol)
    {
        super(pos, vec2(2.3, 1.6), rgb(.95,.95,.2)); // Yellow
        this.gridRow = gridRow;
        this.gridCol = gridCol;
        this.health = ENEMY_CONFIGS.reflector.health;
        this.renderOrder = 5;
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = 0.22;
            // Yellow reflector sprite with angular design
            drawRect(p.add(vec2(0,.3)), vec2(s*4,s), this.color);
            drawRect(p.add(vec2(-.8,0)), vec2(s*2,s*3), this.color);
            drawRect(p.add(vec2(.8,0)), vec2(s*2,s*3), this.color);
            drawRect(p, vec2(s*6,s*2), this.color);
            drawRect(p.add(vec2(-0.5,-.6)), vec2(s,s*2), this.color);
            drawRect(p.add(vec2(0.5,-.6)), vec2(s,s*2), this.color);
        }
    }
}

class Absorber extends RectObject
{
    constructor(pos, gridRow, gridCol)
    {
        super(pos, vec2(2.3, 1.6), rgb(.3,.3,.95)); // Dark blue
        this.gridRow = gridRow;
        this.gridCol = gridCol;
        this.health = ENEMY_CONFIGS.absorber.health;
        this.storedCount = 0;
        this.spitTimer = 0;
        this.renderOrder = 5;
    }

    absorb()
    {
        if (this.storedCount < ENEMY_CONFIGS.absorber.maxStored)
        {
            this.storedCount++;
            this.spitTimer = ENEMY_CONFIGS.absorber.spitDelay;
        }
    }

    spit()
    {
        if (this.storedCount > 0)
        {
            const spreadAngle = PI / 8;
            for (let i = 0; i < this.storedCount; i++)
            {
                const angle = -PI/2 + (i - (this.storedCount-1)/2) * spreadAngle;
                const vel = vec2(Math.cos(angle) * 0.3, Math.sin(angle) * 0.6);
                enemyBullets.push(new EnemyBullet(this.pos.copy(), vel));
            }
            this.storedCount = 0;
            this.spitTimer = 0;
        }
    }

    update()
    {
        if (this.storedCount > 0)
        {
            if (this.spitTimer > 0) this.spitTimer--;
            if (this.spitTimer === 0 || this.storedCount >= ENEMY_CONFIGS.absorber.maxStored)
            {
                this.spit();
            }
        }
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = 0.22;
            // Dark blue absorber sprite
            drawRect(p.add(vec2(0,.3)), vec2(s*5,s), this.color);
            drawRect(p.add(vec2(-0.8,.1)), vec2(s,s*3), this.color);
            drawRect(p.add(vec2(0.8,.1)), vec2(s,s*3), this.color);
            drawRect(p, vec2(s*6,s*3), this.color);
            drawRect(p.add(vec2(-0.4,-.5)), vec2(s*2,s), this.color);
            drawRect(p.add(vec2(0.4,-.5)), vec2(s*2,s), this.color);

            // Draw stored count
            if (this.storedCount > 0)
            {
                drawTextScreen(String(this.storedCount), p.add(vec2(0, 1.2)), 24, rgb(.3,.3,.95), 0, rgb(1,1,1));
            }
        }
    }
}

class Boss extends RectObject
{
    constructor(pos)
    {
        super(pos, vec2(5, 4), rgb(.95,.2,.2)); // Large red
        this.vel = vec2(-0.1, 0);
        this.shootTimer = 0;
        this.cycle = Math.floor((waveN - 1) / 10) + 1;
        this.baseBossHp = ENEMY_CONFIGS.boss.health;
        this.health = this.baseBossHp * (0.5 + this.cycle * 0.3); // Scale health by cycle
        this.renderOrder = 5;
    }

    update()
    {
        // Boss movement - side-to-side
        this.pos = this.pos.add(this.vel);

        const halfSize = this.size.x * 0.5;
        if (this.pos.x - halfSize <= playMin.x || this.pos.x + halfSize >= playMax.x)
            this.vel.x *= -1;

        // Clamp to playfield
        this.pos.x = clamp(this.pos.x, playMin.x + halfSize, playMax.x - halfSize);

        // Boss shooting - scaled with cycle
        const difficulty = calcDifficulty(waveN);
        const bossShootRate = Math.max(30, 60 / (0.8 + this.cycle * 0.4));
        if (this.shootTimer > 0) this.shootTimer--;
        if (this.shootTimer === 0)
        {
            this.shootTimer = bossShootRate;
            // Boss fires 3 bullets spread
            for (let i = -1; i <= 1; i++)
            {
                const vel = vec2(i * 0.2, -0.8);
                enemyBullets.push(new EnemyBullet(this.pos.add(vec2(0, -2)), vel));
            }
        }
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = 0.3;
            // Large boss sprite
            drawRect(p.add(vec2(0,.3)), vec2(s*6,s*2), this.color);
            drawRect(p.add(vec2(-1.5,.1)), vec2(s,s*3), this.color);
            drawRect(p.add(vec2(-0.5,.1)), vec2(s,s*3), this.color);
            drawRect(p.add(vec2(0.5,.1)), vec2(s,s*3), this.color);
            drawRect(p.add(vec2(1.5,.1)), vec2(s,s*3), this.color);
            drawRect(p, vec2(s*8,s*3), this.color);
            drawRect(p.add(vec2(-2,-.5)), vec2(s*2,s*2), this.color);
            drawRect(p.add(vec2(2,-.5)), vec2(s*2,s*2), this.color);
        }
    }
}

class Treasure extends RectObject
{
    constructor(pos)
    {
        super(pos, vec2(3, 3), rgb(.95,.85,.2)); // Gold/yellow
        this.vel = vec2(0.2 + rand(0, 0.1), 0.2 + rand(0, 0.1));
        this.health = ENEMY_CONFIGS.treasure.health;
        this.renderOrder = 7;
    }

    update()
    {
        // Move and bounce off walls
        this.pos = this.pos.add(this.vel);

        const halfSize = this.size.x * 0.5;
        if (this.pos.x - halfSize <= playMin.x || this.pos.x + halfSize >= playMax.x)
            this.vel.x *= -1;
        if (this.pos.y - halfSize <= playMin.y || this.pos.y + halfSize >= playMax.y)
            this.vel.y *= -1;

        // Clamp to playfield
        this.pos.x = clamp(this.pos.x, playMin.x + halfSize, playMax.x - halfSize);
        this.pos.y = clamp(this.pos.y, playMin.y + halfSize, playMax.y - halfSize);
    }

    render()
    {
        if (!this.destroyed)
        {
            const p = this.pos;
            const s = 0.3;
            // Gold treasure sprite
            drawRect(p.add(vec2(0,.2)), vec2(s*5,s*2), this.color);
            drawRect(p.add(vec2(-0.8,-.2)), vec2(s,s*2), this.color);
            drawRect(p.add(vec2(0.8,-.2)), vec2(s,s*2), this.color);
            drawRect(p, vec2(s*6,s*3), this.color);
            drawRect(p.add(vec2(-1,-.6)), vec2(s,s), this.color);
            drawRect(p.add(vec2(0,-.7)), vec2(s,s), this.color);
            drawRect(p.add(vec2(1,-.6)), vec2(s,s), this.color);
        }
    }
}

class EnemyBullet extends RectObject
{
    constructor(pos, vel)
    {
        super(pos, vec2(0.25, 1.2), rgb(.95,.3,.3)); // Red
        this.vel = vel;
        this.renderOrder = 20;
    }
    update()
    {
        this.pos = this.pos.add(this.vel);
        if (this.pos.y < playMin.y - 2 || this.pos.y > playMax.y + 2)
            this.destroy();
    }
}

// Game loop
function gameInit()
{
    setCanvasFixedSize(vec2(960, 540));
    setCameraPos(levelSize.scale(.5));
    cameraScale = 16;

    // Create player
    player = new Player(vec2(levelSize.x/2, playerY));

    // Initialize HUD
    score = 0;
    hiScore = 0;
    lives = 3;
    currentLevel = 1;
    gameOver = false;
    titleScreen = false;
}

function gameUpdate()
{
    // Update bullets and remove destroyed ones
    bullets = bullets.filter(b => !b.destroyed);
    enemyBullets = enemyBullets.filter(b => !b.destroyed);

    // Update treasure
    if (treasure && treasure.destroyed)
        treasure = null;

    // Treasure spawning
    if (waveState === 'combat' && !treasure && treasureSpawnTimer > 0)
        treasureSpawnTimer--;
    if (waveState === 'combat' && !treasure && treasureSpawnTimer === 0)
    {
        // Spawn treasure away from player
        let spawnPos = vec2(rand(10, 50), rand(15, 25));
        if (player)
        {
            while (spawnPos.distance(player.pos) < 15)
                spawnPos = vec2(rand(10, 50), rand(15, 25));
        }
        treasure = new Treasure(spawnPos);
        treasureSpawnTimer = ENEMY_CONFIGS.treasure.spawnInterval;
    }

    // Update enemies
    enemies = enemies.filter(e => !e.destroyed);

    // Bullet-treasure collision
    for (const bullet of bullets)
    {
        if (bullet.destroyed || !treasure) continue;
        if (isOverlapping(bullet.pos, bullet.size, treasure.pos, treasure.size))
        {
            bullet.destroy();
            treasure.health--;
            if (treasure.health <= 0)
            {
                treasure.destroy();
                score += ENEMY_CONFIGS.treasure.score;
                hiScore = max(hiScore, score);
            }
        }
    }

    // Bullet-enemy collisions
    for (const bullet of bullets)
    {
        if (bullet.destroyed) continue;
        for (const enemy of enemies)
        {
            if (enemy.destroyed) continue;
            if (isOverlapping(bullet.pos, bullet.size, enemy.pos, enemy.size))
            {
                if (enemy instanceof Reflector)
                {
                    // Reflect the bullet
                    bullet.vel.y *= -1;
                    bullets.push(new EnemyBullet(bullet.pos.copy(), bullet.vel));
                    bullet.destroy();
                    enemy.health--;
                }
                else if (enemy instanceof Absorber)
                {
                    // Absorb the bullet
                    bullet.destroy();
                    enemy.absorb();
                    break;
                }
                else
                {
                    // Normal bullet hit
                    bullet.destroy();
                    enemy.health--;
                }

                // Check if enemy defeated
                if (!enemy.destroyed && enemy.health <= 0)
                {
                    enemy.destroy();
                    let scoreValue = ENEMY_CONFIGS.shooter.score;
                    if (enemy instanceof Diver) scoreValue = ENEMY_CONFIGS.diver.score;
                    else if (enemy instanceof Reflector) scoreValue = ENEMY_CONFIGS.reflector.score;
                    else if (enemy instanceof Absorber) scoreValue = ENEMY_CONFIGS.absorber.score;
                    score += scoreValue;
                    hiScore = max(hiScore, score);
                }
                break;
            }
        }
    }

    // Player-diver collision
    if (player && !player.destroyed)
    {
        for (const enemy of enemies)
        {
            if (enemy instanceof Diver && enemy.isDiving && !enemy.destroyed)
            {
                if (isOverlapping(player.pos, player.size, enemy.pos, enemy.size))
                {
                    // Player loses a life
                    lives--;
                    if (lives <= 0)
                    {
                        gameOver = true;
                    }
                    enemy.isDiving = false;
                    enemy.pos = enemy.originalPos.copy();
                    break;
                }
            }
        }
    }

    // Boss or formation movement
    if (waveState === 'combat')
    {
        if (boss)
        {
            // Check boss-bullet collision
            for (const bullet of bullets)
            {
                if (bullet.destroyed || !boss) continue;
                if (isOverlapping(bullet.pos, bullet.size, boss.pos, boss.size))
                {
                    bullet.destroy();
                    boss.health--;
                    if (boss.health <= 0)
                    {
                        score += ENEMY_CONFIGS.boss.score;
                        hiScore = max(hiScore, score);
                        waveState = 'boss_defeated';
                        bossDefeatedTimer.set(180);
                        boss.destroy();
                        boss = null;
                    }
                }
            }
        }
        else if (enemies.length > 0)
        {
            updateFormation();
        }
    }

    // Wave FSM
    updateWaveFSM();
}

function updateFormation()
{
    if (enemies.length === 0) return;

    // Calculate formation bounds
    let minX = Infinity, maxX = -Infinity;
    for (const e of enemies)
    {
        const half = e.size.x / 2;
        minX = Math.min(minX, e.pos.x - half);
        maxX = Math.max(maxX, e.pos.x + half);
    }

    // Check for wall hit
    if ((formationDir < 0 && minX < playMin.x + 1) || (formationDir > 0 && maxX > playMax.x - 1))
    {
        formationDir *= -1;
        // Drop formation
        for (const e of enemies)
            e.pos.y -= 1;
        // Speed up slightly
        formationSpeed = Math.min(formationSpeed * 1.1, 0.5);
    }

    // Move formation
    for (const e of enemies)
        e.pos.x += formationDir * formationSpeed;

    // Enemy shooting
    const difficulty = calcDifficulty(waveN);
    if (formationShootTimer > 0) formationShootTimer--;
    if (formationShootTimer === 0)
    {
        formationShootTimer = difficulty.shootRate;
        // Find lowest enemy in a random column
        const randomCol = Math.floor(Math.random() * 11);
        let lowestEnemy = null;
        for (const e of enemies)
        {
            if (e.gridCol === randomCol && (!lowestEnemy || e.pos.y < lowestEnemy.pos.y))
                lowestEnemy = e;
        }
        if (lowestEnemy)
        {
            enemyBullets.push(new EnemyBullet(lowestEnemy.pos.add(vec2(0, -0.8)), vec2(0, -0.6)));
        }
    }
}

function updateWaveFSM()
{
    if (waveState === 'transition')
    {
        if (!transitionTimer.isSet())
        {
            transitionTimer.set(120);
        }
        if (transitionTimer.elapsed())
        {
            waveState = 'combat';
            spawnEnemyGrid();
            treasure = null;
            treasureSpawnTimer = ENEMY_CONFIGS.treasure.spawnInterval;
            if (player)
            {
                player.state = 'pre_entry';
            }
        }
    }
    else if (waveState === 'combat')
    {
        // Check wave clear: all enemies dead + spawn queue empty
        if (enemies.length === 0)
        {
            if (waveN % 10 === 0)
            {
                // Boss defeated
                waveState = 'boss_defeated';
                bossDefeatedTimer.set(180);
            }
            else
            {
                // Normal wave clear
                waveState = 'transition';
                transitionTimer.set(120);
                waveN++;
                if (player)
                {
                    player.state = 'exiting';
                }
            }
        }
    }
    else if (waveState === 'boss_defeated')
    {
        if (bossDefeatedTimer.elapsed())
        {
            waveState = 'cycle_transition';
            cycleTransitionTimer.set(60);
        }
    }
    else if (waveState === 'cycle_transition')
    {
        if (cycleTransitionTimer.elapsed())
        {
            waveState = 'transition';
            transitionTimer.set(120);
            waveN++;
            if (player)
            {
                player.state = 'exiting';
            }
        }
    }
}

function gameUpdatePost()
{
    setCameraPos(levelSize.scale(.5));
}

function gameRender()
{
    // Black playfield background
    drawRect(cameraPos, levelSize.add(vec2(20,20)), rgb(0,0,0));
    drawRect(cameraPos, levelSize, rgb(0,0,0));
}

function gameRenderPost()
{
    // HUD
    const hudY = 30;
    const color = rgb(.2,.95,.25);

    // SCORE at top left
    drawTextScreen('SCORE', vec2(80, hudY), 26, color);
    drawTextScreen(String(score).padStart(4, '0'), vec2(80, hudY + 32), 26, rgb(.95,.95,.95));

    // HI-SCORE on top right
    drawTextScreen('HI-SCORE', vec2(mainCanvasSize.x - 100, hudY), 26, color);
    drawTextScreen(String(hiScore).padStart(4, '0'), vec2(mainCanvasSize.x - 100, hudY + 32), 26, rgb(.95,.95,.95));

    // Lives indicator at bottom left
    const livesY = mainCanvasSize.y - 18;
    for (let i = 0; i < lives - 1 && i < 5; i++)
    {
        const px = 50 + i * 45;
        const py = livesY;
        const shipColor = rgb(.2,.9,.95);
        mainContext.fillStyle = shipColor.toString();
        mainContext.fillRect(px - 2, py - 8, 4, 6);
        mainContext.fillRect(px - 12, py - 2, 24, 8);
        mainContext.fillRect(px - 16, py + 2, 6, 4);
        mainContext.fillRect(px + 10, py + 2, 6, 4);
    }

    // Wave indicator at bottom right
    let waveLabel = `WAVE ${waveN}`;
    if (waveN % 10 === 0)
        waveLabel += ' (BOSS)';
    drawTextScreen(waveLabel, vec2(mainCanvasSize.x - 120, livesY + 3), 26, rgb(.2,.9,.95));

    // Temperature bar (below player)
    if (player)
    {
        const barX = mainCanvasSize.x / 2;
        const barY = mainCanvasSize.y - 60;
        const barWidth = 200;
        const barHeight = 12;
        const tempPercent = clamp(player.temperature / TEMP_OVERHEAT, 0, 1);

        // Background
        mainContext.fillStyle = 'rgba(50, 50, 50, 0.8)';
        mainContext.fillRect(barX - barWidth/2, barY, barWidth, barHeight);

        // Temperature fill color gradient
        let fillColor;
        if (player.temperature < TEMP_WARM_MIN)
            fillColor = 'rgb(100, 150, 255)'; // Blue (cool)
        else if (player.temperature < TEMP_WARM_MAX)
            fillColor = 'rgb(255, 200, 100)'; // Orange (warm)
        else
            fillColor = 'rgb(255, 100, 100)'; // Red (hot/overheat)

        mainContext.fillStyle = fillColor;
        mainContext.fillRect(barX - barWidth/2, barY, barWidth * tempPercent, barHeight);

        // Border
        mainContext.strokeStyle = 'rgb(200, 200, 200)';
        mainContext.lineWidth = 1;
        mainContext.strokeRect(barX - barWidth/2, barY, barWidth, barHeight);

        // Temperature label
        drawTextScreen(`TEMP ${Math.floor(player.temperature)}`, vec2(barX, barY - 15), 16, color);
    }
}

// Start engine
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);

</script>
